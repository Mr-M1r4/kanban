services:
  db:
    image: postgres:16-alpine
    container_name: kanban-db-compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    volumes:
      - kanban_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
    container_name: kanban-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://kanban:kanban@db:5432/kanban?schema=public"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      BOARD_PIN: "${BOARD_PIN:-}"
    ports:
      - "3000:3000"

volumes:
  kanban_db_data:
